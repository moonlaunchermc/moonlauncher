name: Linux Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Linux release tag
        required: true
        type: string
        default: linux-v2.1.3-beta.1
  push:
    tags:
      - 'linux-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Moon Launcher
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Resolve release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#linux-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Invalid Linux release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$version" =~ -beta\.[0-9]+$ ]]; then
            echo 'IS_PRERELEASE=true' >> "$GITHUB_ENV"
          else
            echo 'IS_PRERELEASE=false' >> "$GITHUB_ENV"
          fi

      - name: Check out pinned XMCL runtime
        run: |
          source="$RUNNER_TEMP/xmcl"
          git clone --filter=blob:none https://github.com/Voxelum/x-minecraft-launcher.git "$source"
          git -C "$source" checkout 9f1354bd6dc74e76ef9eebcb6a424f48bf3ca064
          echo "XMCL_SOURCE=$source" >> "$GITHUB_ENV"

      - name: Install XMCL workspace dependencies
        run: cd "$XMCL_SOURCE" && pnpm install --frozen-lockfile

      - name: Apply Moon branding and license notices
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node windows/rebrand-xmcl.mjs "$XMCL_SOURCE" "$RELEASE_TAG"

      - name: Verify CurseForge API key
        env:
          CURSEFORGE_API_KEY: ${{ secrets.api_key_curseforge || secrets.API_KEY_CURSEFORGE || secrets.CURSEFORGE_API_KEY || secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [[ -z "$CURSEFORGE_API_KEY" ]]; then
            echo 'Set api_key_curseforge as a repository Actions secret before building.' >&2
            exit 1
          fi

      - name: Build Moon Linux AppImage
        env:
          CURSEFORGE_API_KEY: ${{ secrets.api_key_curseforge || secrets.API_KEY_CURSEFORGE || secrets.CURSEFORGE_API_KEY || secrets.CURSEFORGE_API_TOKEN }}
        run: |
          cd "$XMCL_SOURCE"
          pnpm run build:renderer
          BUILD_TARGET=linux pnpm run build
          destination="$GITHUB_WORKSPACE/linux/dist"
          mkdir -p "$destination"
          mapfile -t installers < <(find xmcl-electron-app/build/output -maxdepth 1 -type f -name "MoonLauncher-v${RELEASE_VERSION}-x86_64.AppImage")
          if [[ "${#installers[@]}" -ne 1 ]]; then
            echo "Expected one Moon x86_64 AppImage, found ${#installers[@]}" >&2
            exit 1
          fi
          cp "${installers[0]}" "$destination/MoonLauncher-v${RELEASE_VERSION}-x64.AppImage"
          cp xmcl-electron-app/build/Moon-Third-Party-Notices.txt "$destination/"
          cd "$destination"
          sha256sum "MoonLauncher-v${RELEASE_VERSION}-x64.AppImage" > SHA256SUMS.txt

      - name: Validate Linux installer
        run: node scripts/validate-release.mjs linux '${{ inputs.release_tag || github.ref_name }}' linux/dist

      - name: Upload Linux installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonLauncher-v${{ env.RELEASE_VERSION }}-Linux-x64
          path: linux/dist/*

      - name: Publish Linux release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Moon Launcher Linux v${{ env.RELEASE_VERSION }} x64
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: linux/dist/*
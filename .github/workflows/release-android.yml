name: Android Standalone Launcher Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Android standalone launcher release tag
        required: true
        type: string
        default: v2.1.3-beta.1
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Moon Launcher
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724'

      - name: Check out ZalithLauncher2 runtime
        uses: actions/checkout@v4
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: b2aa23be7de0cc5d17845ccecc9402174ad31ee6
          path: runtime
          submodules: recursive

      - name: Rebrand Zalith runtime as Moon Launcher
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node android/rebrand-zalith.mjs runtime "$RELEASE_TAG"

      - name: Install Android Rust build tools
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          validate-wrappers: false

      - name: Build Moon Android launcher
        run: |
          cd runtime
          chmod +x gradlew
          gradle :ZalithLauncher:assembleDebug -Darch=arm64
          cd ..
          mkdir -p release-artifacts
          cp runtime/ZalithLauncher/build/outputs/apk/debug/*arm64*.apk "release-artifacts/Moon-Launcher-${{ inputs.release_tag || github.ref_name }}-Android.apk"

      - name: Validate and checksum Android artifact
        run: |
          node scripts/validate-release.mjs android '${{ inputs.release_tag || github.ref_name }}' release-artifacts > release-artifacts/SHA256SUMS.txt
          cat release-artifacts/SHA256SUMS.txt

      - name: Publish standalone Android beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Moon Launcher Android ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-artifacts/Moon-Launcher-${{ inputs.release_tag || github.ref_name }}-Android.apk
            release-artifacts/SHA256SUMS.txt
            android/THIRD_PARTY_NOTICES.md
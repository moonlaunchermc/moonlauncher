name: Android Standalone Launcher Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Android standalone launcher release tag
        required: true
        type: string
        default: v2.1.2-beta.1
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Moon Launcher
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.3.13750724'

      - name: Check out standalone game runtime
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: 330c6eae3164df64bdc4828e946a9e62cc5169e4
          path: runtime

      - name: Initialize runtime submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git -C runtime submodule update --init --recursive

      - name: Download Android Java runtime
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: runtime/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Rebrand standalone runtime as Moon Launcher
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node android/rebrand-amethyst.mjs runtime "$RELEASE_TAG"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          validate-wrappers: false

      - name: Build Moon Android launcher
        run: |
          cd runtime
          ./scripts/languagelist_updater.sh
          gradle :app_pojavlauncher:assembleDebug
          cd ..
          mkdir -p release-artifacts
          cp runtime/app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk "release-artifacts/Moon-Launcher-${{ inputs.release_tag || github.ref_name }}-Android.apk"

      - name: Validate and checksum Android artifact
        run: |
          node scripts/validate-release.mjs android '${{ inputs.release_tag || github.ref_name }}' release-artifacts > release-artifacts/SHA256SUMS.txt
          cat release-artifacts/SHA256SUMS.txt

      - name: Publish standalone Android beta
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Moon Launcher Android ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-artifacts/Moon-Launcher-${{ inputs.release_tag || github.ref_name }}-Android.apk
            release-artifacts/SHA256SUMS.txt
            runtime/app_pojavlauncher/src/main/assets/moon-third-party-notices.txt